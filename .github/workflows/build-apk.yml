name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Activar Caché de Gradle para compilación rápida
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Generar carpeta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Compilar archivo APK Release
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK con versión 1.0.5
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Perk-Wallet-v1.0.5.apk
          cp android/app/build/outputs/apk/release/app-release.apk Perk-Wallet.apk
          cp android/app/build/outputs/apk/release/app-release.apk Finanzas-USA-v1.0.5.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Perk-Wallet-v1.0.5-APK
          path: Perk-Wallet-v1.0.5.apk

      - name: Publicar APK v1.0.5 en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Perk Wallet Android APK (v1.0.5) — Nueva Identidad, Gráficas y Control de Ahorros"
          make_latest: true
          body: |
            ### 🚀 Perk Wallet v1.0.5 — Nueva Identidad, Gráficas Inteligentes y Control Total de Ahorros

            ¡Te damos la bienvenida a **Perk Wallet**! Esta versión **v1.0.5** marca una evolución integral de la app, combinando un diseño moderno estilo billetera digital, soporte multimoneda global, métricas operativas limpias y copias de seguridad automáticas:

            ---

            #### 💎 1. Nueva Identidad de Marca: Perk Wallet
            - La app evoluciona oficialmente de *Finanzas USA* a **Perk Wallet**, diseñada para gestionar finanzas personales en cualquier parte del mundo con más de 25 divisas globales (USD, EUR, MXN, COP, GBP, JPY, CAD, etc.).

            #### 📊 2. Gráficas Inteligentes Enfocadas en tu Balance Operativo
            - **Filtro de Balance Disponible**: Las gráficas circulares, flujos netos, ingresos y gastos ahora operan exclusivamente sobre tu dinero disponible para gastos (`Mi Balance Disponible`), omitiendo las cuentas de ahorro para no distorsionar tu flujo diario.
            - **Cálculo sincronizado**: Desglose por categorías y comisiones bancarias 100% fiel a los movimientos de tus cuentas activas.

            #### 💰 3. Separación Rigurosa: Mis Ahorros vs Dinero Ajeno
            - **Mis Ahorros Protegidos**: El dinero que destinas a ahorros cuenta con su propio sub-balance e indicadores independientes.
            - **Cuentas Separadas / Dinero Ajeno**: Ahora filtra estrictamente las cuentas de terceras personas (`isOtherPersonAccount`). Tu dinero y tus ahorros nunca volverán a mezclarse con cuentas de otros.

            #### 🏦 4. Gestión y Reordenamiento Interactivo de Cuentas
            - **Arrastrar y Soltar (Drag & Drop)**: Reordena tus cuentas apretando y subiendo o bajando con el dedo en tiempo real, o usando las flechas de posición.
            - **Cuenta Principal Automática**: La cuenta que coloques en la posición #1 es seleccionada automáticamente al registrar cualquier gasto o ingreso.
            - **Sección Aparte de Mis Ahorros**: Cuentas de ahorro separadas en su propio bloque con saldo acumulado independiente y opción de ocultar/mostrar.
            - **Botones Optimizados**: Corrección del desborde de texto en "Agregar Banco o Cuenta" y distribución balanceada de acciones.

            #### 📁 5. Respaldos Automáticos y Google Drive
            - Creación automática y organizada en la carpeta dedicada `PerkWallet_Respaldos/`.
            - Nombres descriptivos con fecha y hora (`PerkWallet_Respaldo_YYYY-MM-DD_HH-mm.json`).
            - Auto-backup silencioso en segundo plano al abrir y cerrar la app.
            - Integración fluida para subir a Google Drive o compartir en almacenamiento local.

            #### 🔔 6. Recordatorios Locales Diarios en Android
            - Recordatorio configurable con selección de hora para registrar tus gastos cotidianos.
            - Alertas preventivas 1 a 2 días antes de cada vencimiento de pagos recurrentes o cuotas.
            - Interfaz limpia: eliminado botón de prueba en recurrentes para una experiencia más profesional.

            #### 🌓 7. Modo Dual Claro / Oscuro con Alto Contraste
            - Paleta ergonómica optimizada en modo claro y oscuro, eliminando cualquier inconsistencia de contraste o textos ilegibles.
            - Navegación fluida: al cambiar de pestaña la app vuelve automáticamente al inicio superior.
          files: |
            Perk-Wallet-v1.0.5.apk
            Perk-Wallet.apk
            Finanzas-USA-v1.0.5.apk
            android/app/build/outputs/apk/release/app-release.apk
