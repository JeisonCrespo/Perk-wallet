name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Activar Caché de Gradle para compilación rápida
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias npm
        run: npm install --legacy-peer-deps

      - name: Generar carpeta nativa Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_GIT_STATUS: 1

      - name: Compilar archivo APK Release
        working-directory: ./android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK con versión 1.0.6
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Perk-Wallet-v1.0.6.apk
          cp android/app/build/outputs/apk/release/app-release.apk Perk-Wallet.apk

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Perk-Wallet-v1.0.6-APK
          path: Perk-Wallet-v1.0.6.apk

      - name: Publicar APK v1.0.6 en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Perk Wallet Android APK (v1.0.6) — Selectores Inteligentes, Multimoneda y Gastos Modificados"
          make_latest: true
          body: |
            ### 🚀 Perk Wallet v1.0.6 — Selectores Inteligentes, Multimoneda Real y Control de Gastos Olvidados

            Esta actualización **v1.0.6** mejora drásticamente la experiencia de registro, incorpora soporte multimoneda independiente por país/banco, calendario de movimientos y control automático de gastos olvidados:

            ---

            #### 📋 1. Selectores Verticales con Buscador (Cuentas, Categorías y Bancos)
            - **Adiós a deslizar horizontalmente**: Todos los formularios ahora cuentan con selectores desplegables verticales con buscador, íconos, saldos y agrupación automática (*Incluido en el total*, *Ahorros / Excluido*, *Dinero Ajeno*).

            #### 💱 2. Multimoneda Real, Monedas Secundarias y Bancos por País
            - **Moneda Principal y Secundarias**: Agrega divisas secundarias en Ajustes y alterna entre ellas en 1 toque desde el botón de moneda en Resumen.
            - **Aislamiento por País/Moneda**: Cada banco y cuenta es independiente en su divisa. Al cambiar de moneda (ej. `USD` ↔ `COP`), los bancos, programados, cuotas, préstamos y movimientos de un país no se mezclan con los del otro.
            - **Catálogo de Bancos por País**: Bancos locales integrados (Colombia, México, EE. UU., España, Venezuela, Argentina, Chile, Perú, Brasil, Rep. Dominicana, Canadá y Reino Unido).
            - **Formato Limpio sin Desbordes**: Todos los montos y etiquetas muestran la moneda activa sin cortarse ni salirse de sus tarjetas.

            #### 📅 3. Movimientos Futuros Programados + Calendario de Historial
            - **Fechas Futuras**: Los gastos, ingresos o transferencias con fecha futura quedan marcados como `⏳ Programado` y no alteran tu saldo sino hasta que llegue el día indicado.
            - **Historial en Calendario**: La pantalla principal muestra los 6 movimientos más recientes e incluye el botón **"Ver más en Calendario"** para explorar tus gastos e ingresos día por día.

            #### 📉 4. Gráfica Aparte de "Gastos Modificados" (Gastos Olvidados)
            - Al ajustar manualmente el saldo de una cuenta hacia abajo porque olvidaste registrar un gasto, la diferencia se guarda automáticamente bajo **`Gastos Modificados`** y aparece en su propia tarjeta/gráfica en la pestaña **Gráficas**.

            #### 🤝 5. Recurrentes Compartidos, Comisiones en Préstamos y Memoria en Ahorros
            - **Consolidación en Préstamos**: Los gastos recurrentes compartidos que aún no te pagan se envían a Préstamos bajo la categoría del servicio (ej. *Netflix*) y se **acumulan en un solo préstamo** si es la misma persona y servicio.
            - **Comisiones en Préstamos**: Soporte de comisiones (`$`) tanto al crear un préstamo como al registrar abonos o cobros.
            - **Persistencia en Bancos**: La app recuerda cuando ocultas la sección de *"Mis Cuentas de Ahorro"*.

            #### 🔔 6. Correcciones Adicionales y Notificaciones
            - **Recordatorio Diario de Gastos Arreglado**: Los recordatorios diarios en Android ya no se borran al sincronizar alertas de pagos recurrentes.
            - **Corrección Visual**: Arreglado el botón *Eliminar* en edición de movimientos, eliminado el icono de ojo repetido en Balance Total y quitado el botón repetido de *Registrar* en el historial.
          files: |
            Perk-Wallet-v1.0.6.apk
            Perk-Wallet.apk
            android/app/build/outputs/apk/release/app-release.apk
